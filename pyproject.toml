[project]
name = "keenable-search-eval"
version = "0.1.0"
description = "Controlled CodeRabbit and developer-documentation search evaluations"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML>=6,<7", "httpx>=0.28,<0.29", "mcp>=1.20,<2", "uvicorn>=0.35,<1", "starlette>=0.47,<1", "matplotlib>=3.10,<4", "aiohttp>=3.12,<4", "openai>=2,<3", "requests>=2.32.5,<3", "tqdm>=4.66,<5", "claude-agent-sdk==0.2.143", "pydantic>=2.11,<3", "python-dotenv>=1,<2", "anyio>=4,<5", "numpy>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
search-eval = "search_eval.cli:main"
search-eval-mcp = "search_eval.gateway:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/search_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
